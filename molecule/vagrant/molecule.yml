---
driver:
  name: vagrant
  provider:
    name: libvirt
  provision: true

platforms:
  #- name: stream10
  #  box: centos/stream10
  #  cpus: 1
  #  memory: 1024
  #  provider_options:
  #    video_type: 'vga'
  - name: stream9
    box: generic/centos9s
    cpus: 1
    memory: 1024
    provider_options:
      video_type: 'vga'

dependency:
  name: galaxy
  options:
    #role-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
    #requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
    ignore-errors: true
    force: false

provisioner:
  name: ansible

verifier:
  name: ansible

prerun: false

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
      library: ~/.local/lib/python3.12/site-packages/molecule_plugins/vagrant/modules
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"

scenario:
#  name: vagrant
  test_sequence:
    - dependency
    - create
#    - prepare
    - converge
    - idempotence
#    - verify
#    - cleanup
    - destroy
